# Deploy Unity WebGL to GitHub Pages (UPDATED)

name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # ✅ updated

      - name: Setup Pages
        uses: actions/configure-pages@v5   # ✅ updated

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3   # ✅ updated
        with:
          path: '.'   # your WebGL files location

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4   # ✅ updated